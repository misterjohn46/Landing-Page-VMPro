<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uji Coba doit.id - Vega MediaPro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- doit.id Embed Script -->
    <script src="https://doit.id/embed.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-indigo-500 selection:text-white">
    <div class="max-w-md w-full bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
        <!-- Glow accent -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header -->
        <div class="text-center mb-6">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 mb-3">
                <span class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span> doit.id Gateway (QRIS &amp; VA)
            </span>
            <h1 class="text-2xl font-extrabold text-white tracking-tight">Uji Pembayaran doit.id</h1>
            <p class="text-slate-400 text-xs mt-1">Simulasi transaksi QRIS &amp; Virtual Account multi-bank.</p>
        </div>

        <div id="error-box" class="hidden p-4 rounded-2xl bg-rose-500/10 border border-rose-500/20 text-xs text-rose-300 mb-5">
            <div class="flex items-start gap-2.5">
                <i class="fa-solid fa-triangle-exclamation text-rose-400 mt-0.5 shrink-0"></i>
                <div id="error-message"></div>
            </div>
        </div>

        <!-- Form -->
        <form id="form-test-doit" onsubmit="handleDoitTestSubmit(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Nama Pembayar</label>
                <input type="text" id="cust-name" value="John Danulfa" required
                       class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-white text-xs focus:outline-none focus:border-indigo-500 transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Nomor WhatsApp / HP</label>
                <input type="tel" id="cust-phone" value="082335338113" required
                       class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-white text-xs focus:outline-none focus:border-indigo-500 transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Metode Pembayaran (Rail)</label>
                <select id="rail" class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-white text-xs focus:outline-none focus:border-indigo-500 transition">
                    <option value="any">Semua Metode (QRIS, VA Bank, dll)</option>
                    <option value="qris">Khusus QRIS</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Pilih Nominal</label>
                <div class="grid grid-cols-3 gap-2">
                    <label class="cursor-pointer">
                        <input type="radio" name="test-amount" value="50000" class="peer sr-only">
                        <div class="py-2.5 text-center rounded-xl border border-slate-800 bg-slate-950 text-xs font-bold text-slate-400 peer-checked:border-indigo-500 peer-checked:bg-indigo-500/10 peer-checked:text-indigo-400 transition">
                            Rp 50.000
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="test-amount" value="150000" checked class="peer sr-only">
                        <div class="py-2.5 text-center rounded-xl border border-slate-800 bg-slate-950 text-xs font-bold text-slate-400 peer-checked:border-indigo-500 peer-checked:bg-indigo-500/10 peer-checked:text-indigo-400 transition">
                            Rp 150.000
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="test-amount" value="500000" class="peer sr-only">
                        <div class="py-2.5 text-center rounded-xl border border-slate-800 bg-slate-950 text-xs font-bold text-slate-400 peer-checked:border-indigo-500 peer-checked:bg-indigo-500/10 peer-checked:text-indigo-400 transition">
                            Rp 500.000
                        </div>
                    </label>
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" id="btn-submit"
                        class="w-full py-3.5 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-400 hover:to-purple-500 text-white font-bold text-xs shadow-lg shadow-indigo-500/25 transition flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-credit-card"></i>
                    <span id="btn-submit-text">Bayar via doit.id Sekarang</span>
                </button>
            </div>
        </form>

        <div class="mt-5 text-center">
            <a href="https://vegamediapro.web.id" class="text-xs text-slate-500 hover:text-slate-300 transition">
                &larr; Kembali ke Beranda Vega MediaPro
            </a>
        </div>
    </div>

    <script>
        async function handleDoitTestSubmit(e) {
            e.preventDefault();
            const errBox = document.getElementById('error-box');
            const errMsg = document.getElementById('error-message');
            errBox.classList.add('hidden');

            const btn = document.getElementById('btn-submit');
            const btnText = document.getElementById('btn-submit-text');
            const originalText = btnText.textContent;

            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const rail = document.getElementById('rail').value;
            const amount = Number(document.querySelector('input[name="test-amount"]:checked').value) || 150000;
            const invoice = 'VMP-DOIT-' + Date.now().toString().slice(-8);

            try {
                btn.disabled = true;
                btnText.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Menghubungkan ke doit.id...';

                const res = await fetch('/api/doit-checkout.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        packageName: 'Uji Pembayaran doit.id',
                        price: amount,
                        name: name,
                        phone: phone,
                        rail: rail,
                        invoice: invoice
                    })
                });

                const result = await res.json();

                if (result.status === 'success' && result.hosted_url) {
                    btnText.innerHTML = '<i class="fa-solid fa-check"></i> Membuka Checkout...';
                    
                    // Gunakan doit embed modal jika tersedia, atau redirect
                    if (window.doit && typeof window.doit.open === 'function') {
                        btn.disabled = false;
                        btnText.textContent = originalText;
                        window.doit.open(result.hosted_url, {
                            onPaid: function (ev) {
                                window.location.href = `/payment-finish.html?order_id=${encodeURIComponent(invoice)}&amount=${encodeURIComponent(amount)}&pkg=Uji+Pembayaran+doit.id&gateway=doit`;
                            },
                            onClose: function () {
                                console.log('Checkout modal closed');
                            }
                        });
                    } else {
                        window.location.href = result.hosted_url;
                    }
                } else {
                    btn.disabled = false;
                    btnText.textContent = originalText;
                    errBox.classList.remove('hidden');
                    errMsg.textContent = result.message || 'Gagal memproses pembayaran ke server doit.id.';
                }
            } catch (err) {
                console.error('Doit Checkout Error:', err);
                btn.disabled = false;
                btnText.textContent = originalText;
                errBox.classList.remove('hidden');
                errMsg.textContent = 'Terjadi kesalahan koneksi: ' + err.message;
            }
        }
    </script>
</body>
</html>
